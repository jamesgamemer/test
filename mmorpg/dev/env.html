<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightglade environment art</title>
<style>
  html, body { margin: 0; background: #05070c; color: #cfd8ea; font: 13px/1.4 system-ui, sans-serif; }
  #grid { display: grid; align-items: start; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 14px; }
  figure { margin: 0; background: #0b0f18; border: 1px solid #1c2538; border-radius: 8px; overflow: hidden; }
  figure canvas, figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 6px 9px; display: flex; justify-content: space-between; gap: 8px; }
  figcaption b { color: #ffd08a; }
  header { padding: 14px 14px 0; } h1 { margin: 0 0 4px; font-size: 17px; } p { margin: 0; color: #8e9bb4; }
  .chk { background: repeating-conic-gradient(#2a2440 0 25%, #1c1830 0 50%) 0 0 / 24px 24px; }
</style>
</head>
<body>
<header>
  <h1>Nightglade — generated environment art</h1>
  <p>Every prop, ground texture and foliage card in assets/env/, loaded with the game's own loader. Red line: +x. Blue line: +z. The grid squares are a quarter of the model's longest side.</p>
</header>
<div id="grid"></div>
<script type="module">
import { THREE } from '../src/gfx/common.js';
import { loadEnv, propMaterial } from '../src/gfx/assets.js';

const grid = document.getElementById('grid');
const S = 420;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(S, S, false);
renderer.setClearColor(0x10151f, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x30281c, 1.6));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6); sun.position.set(2, 3, 2.5); scene.add(sun);
const helper = new THREE.GridHelper(2, 8, 0x2c3a58, 0x1c2538); scene.add(helper);
const axes = new THREE.Group();
const line = (c, x, z) => { const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.002, 0), new THREE.Vector3(x, 0.002, z)]); return new THREE.Line(g, new THREE.LineBasicMaterial({ color: c })); };
axes.add(line(0xff5050, 1, 0), line(0x5080ff, 0, 1)); scene.add(axes);
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);

const fig = (title, note) => {
  const f = document.createElement('figure'), cap = document.createElement('figcaption');
  cap.innerHTML = `<span><b>${title}</b></span><span>${note}</span>`;
  grid.append(f); return { f, cap };
};

const env = await loadEnv();
const views = [];
for (const name in env.models) {
  const m = env.models[name];
  const { f, cap } = fig(name, `${m.geo.index.count / 3} tris · ${m.size.map((v) => v.toFixed(2)).join(' × ')}`);
  const cv = document.createElement('canvas'); cv.width = cv.height = S; f.append(cv, cap);
  views.push({ cv, ctx: cv.getContext('2d'), mesh: new THREE.Mesh(m.geo, propMaterial(m)), h: m.size[1] });
}
for (const group of ['ground', 'cards']) for (const name in env[group]) {
  const t = env[group][name], img = t.map.image;
  const { f, cap } = fig(name, `${img.width} × ${img.height}${t.cells ? ' · ' + t.cells + ' cards' : ''}`);
  const el = document.createElement('img'); el.src = t.map.image.src; el.className = 'chk'; f.append(el, cap);
}

let t0 = performance.now();
window.envShot = (angle) => {
  for (const v of views) {
    scene.add(v.mesh);
    const a = angle, d = 2.6;
    if (window.envTop) { cam.position.set(0, 4.2, 0.001); cam.lookAt(0, 0, 0); } // plan view: +x right, +z down
    else { cam.position.set(Math.sin(a) * d, 0.9 + v.h * 0.5, Math.cos(a) * d); cam.lookAt(0, v.h * 0.45, 0); }
    renderer.render(scene, cam);
    v.ctx.drawImage(renderer.domElement, 0, 0);
    scene.remove(v.mesh);
  }
};
const loop = (now) => { window.envShot(window.envAngle ?? 0.6 + (now - t0) * 0.0003); requestAnimationFrame(loop); };
window.envReady = true;
requestAnimationFrame(loop);
</script>
</body>
</html>
